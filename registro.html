
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelpDesk | Registro</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="pagina-auth">

  <main class="auth-contenedor">
    <section class="auth-tarjeta">

      <div class="auth-encabezado">
        <div class="auth-logo">H</div>
        <h1>HelpDesk</h1>
        <p>Sistema de reportes de averías</p>
      </div>

      <div class="auth-titulo">
        <h2>Crear cuenta</h2>
        <p>Completá tus datos para registrarte.</p>
      </div>

      <form id="formRegistro">

        <div class="campo">
          <label for="nombre">Nombre completo</label>
          <input
            type="text"
            id="nombre"
            placeholder="Ingresá tu nombre"
            autocomplete="name"
            required
          >
        </div>

        <div class="campo">
          <label for="correo">Correo electrónico</label>
          <input
            type="email"
            id="correo"
            placeholder="ejemplo@correo.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            placeholder="Mínimo 6 caracteres"
            minlength="6"
            autocomplete="new-password"
            required
          >
        </div>

        <div class="campo">
          <label for="confirmarPassword">
            Confirmar contraseña
          </label>
          <input
            type="password"
            id="confirmarPassword"
            placeholder="Repetí tu contraseña"
            minlength="6"
            autocomplete="new-password"
            required
          >
        </div>

        <button
          type="submit"
          class="boton principal auth-boton"
        >
          Crear cuenta
        </button>

      </form>

      <div id="mensajeAuth" role="status" aria-live="polite"></div>

      <div class="auth-pie">
        <p>
          ¿Ya tenés una cuenta?
          <a href="login.html">Iniciá sesión aquí</a>
        </p>
      </div>

    </section>
  </main>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/registro.js"></script>

</body>
</html>
