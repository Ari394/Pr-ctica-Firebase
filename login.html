
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelpDesk | Iniciar sesión</title>
  <link rel="stylesheet" href="css/styles.css">

</head>

<body class="pagina-auth">

  <main class="auth-contenedor">
    <section class="auth-tarjeta">

      <div class="auth-encabezado">
        <div class="auth-logo">H</div>
        <h1>HelpDesk</h1>
        <p>Sistema de reportes de averías</p>
      </div>

      <div class="auth-titulo">
        <h2>Iniciar sesión</h2>
        <p>Ingresá tus datos para continuar.</p>
      </div>

      <form id="formLogin">

        <div class="campo">
          <label for="correo">Correo electrónico</label>
          <input
            type="email"
            id="correo"
            placeholder="ejemplo@correo.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            placeholder="Ingresá tu contraseña"
            autocomplete="current-password"
            required
          >
        </div>

        <button
          type="submit"
          class="boton principal auth-boton"
        >
          Iniciar sesión
        </button>

      </form>

      <div id="mensajeAuth" role="status" aria-live="polite"></div>

      <div class="auth-pie">
        <p>
          ¿No tenés una cuenta?
          <a href="registro.html">Registrate aquí</a>
        </p>
      </div>

    </section>
  </main>
 <script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/auth.js"></script>
</body>
</html>
